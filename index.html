        function aggregateRoutes() {
            const result = {};
            Object.keys(ROUTES).forEach(routeId => {
                result[routeId] = {
                    buses: [],
                    ordinaryCount: 0,
                    supportCount: 0,
                    avgLoad: 0,
                    status: "MONITOR",
                    statusClass: "",
                    interval: `${Math.round((ROUTES[routeId]?.headwaySeconds || 420) / 60)} min est.`
                };
            });

            latestBuses.forEach(bus => {
                const routeId = normalizeRouteId(bus.routeId);
                if (!result[routeId]) return;
                result[routeId].buses.push(bus);
                if (isSupportBus(bus)) result[routeId].supportCount += 1;
                else result[routeId].ordinaryCount += 1;
            });

            Object.entries(result).forEach(([routeId, stats]) => {
                if (!stats.buses.length) return;

                const avgPassengers = stats.buses.reduce((sum, bus) => sum + num(bus.passengerCount), 0) / stats.buses.length;
                stats.avgLoad = Math.round((avgPassengers / BUS_CAPACITY) * 100);

                const hasHighTraffic = stats.buses.some(bus => bus.trafficLevel === "HIGH");
                const hasQueue = stats.buses.some(bus => num(bus.waitingPassengers) > 0);
                const hasSupport = stats.buses.some(isSupportBus);
                const hasRerouting = routeId === "Route_57" && route57ScenarioActive()
                    && stats.buses.some(bus => bus.reroutingActive || bus.reroutingDecision === "REROUTING_ACTIVE" || bus.eventType === "REROUTING");
                const waitingNextBus = stats.buses.some(bus => bus.supportDecision === "WAIT_FOR_NEXT_BUS") || (hasQueue && stats.ordinaryCount > 1 && !hasSupport);
                const headway = ROUTES[routeId]?.headwaySeconds || 420;
                stats.interval = `${Math.round(headway / 60)} min est.`;

                if (hasRerouting) {
                    stats.status = "REROUTING";
                    stats.statusClass = "reroute";
                } else if (hasSupport) {
                    stats.status = "SUPPORT OPERATING";
                    stats.statusClass = "warn";
                } else if (waitingNextBus) {
                    stats.status = "WAITING NEXT BUS";
                    stats.statusClass = "warn";
                } else if (hasQueue) {
                    stats.status = "QUEUE";
                    stats.statusClass = "danger";
                } else if (hasHighTraffic) {
                    stats.status = "DELAYED";
                    stats.statusClass = "warn";
                } else {
                    stats.status = "NORMAL";
                    stats.statusClass = "";
                }
            });

            return result;
        }

        function ensureBusOption(bus) {
            const select = document.getElementById("bus-select");
            const exists = Array.from(select.options).some(option => option.value === bus.busId);
            if (exists) return;

            const option = document.createElement("option");
            option.value = bus.busId;
            option.textContent = `${bus.busId} (${normalizeRouteId(bus.routeId)})`;
            select.appendChild(option);
        }

        function syncSelectedBus() {
            if (latestBuses.some(bus => bus.busId === selectedBusId)) return;
            if (latestBuses.some(bus => bus.busId === "Bus_1")) {
                selectedBusId = "Bus_1";
            } else if (latestBuses.length) {
                selectedBusId = latestBuses[0].busId;
            }
            document.getElementById("bus-select").value = selectedBusId;
        }

        function selectedBus() {
            return latestBuses.find(bus => bus.busId === selectedBusId) || null;
        }

        function updateMarkers() {
            const liveIds = new Set(latestBuses.map(bus => bus.busId));

            Object.keys(busMarkers).forEach(busId => {
                if (!liveIds.has(busId)) {
                    map.removeLayer(busMarkers[busId]);
                    delete busMarkers[busId];
                }
            });

            latestBuses.forEach(bus => {
                ensureBusOption(bus);

                const latLng = [num(bus.latitude), num(bus.longitude)];
                const popup = compactPopup(bus);

                if (busMarkers[bus.busId]) {
                    busMarkers[bus.busId].setLatLng(latLng);
                    busMarkers[bus.busId].setIcon(makeBusIcon(bus));
                    busMarkers[bus.busId].setPopupContent(popup);
                } else {
                    const marker = L.marker(latLng, { icon: makeBusIcon(bus) })
                        .bindPopup(popup)
                        .addTo(map);

                    marker.on("click", () => {
                        selectedBusId = bus.busId;
                        document.getElementById("bus-select").value = selectedBusId;
                        renderAll();
                        marker.openPopup();
                        map.setView(marker.getLatLng(), 14);
                    });

                    busMarkers[bus.busId] = marker;
                }
            });
        }

        function updateKpis() {
            const baseRoutes = new Set(latestBuses.map(bus => normalizeRouteId(bus.routeId)).filter(Boolean));
            const alerts = buildOperationalAlerts().length;
            const decisions = buildRouteDecisionItems().length;

            document.getElementById("kpi-active-buses").textContent = latestBuses.length;
            document.getElementById("kpi-active-routes").textContent = baseRoutes.size;
            document.getElementById("kpi-alerts").textContent = alerts;
            document.getElementById("kpi-decisions").textContent = decisions;
        }

        function tile(label, value) {
            return `<div class="info-tile"><span>${label}</span><b>${escapeHtml(value)}</b></div>`;
        }

        function recordBusSamples() {
            latestBuses.forEach(bus => {
                if (!busSamples[bus.busId]) busSamples[bus.busId] = [];
                busSamples[bus.busId].push({
                    passengerCount: num(bus.passengerCount),
                    speedKmh: speedKmh(bus),
                    timestamp: Date.now()
                });
                busSamples[bus.busId] = busSamples[bus.busId].slice(-28);
            });
        }

        function trendSvg(values, color, maxValue) {
            const clean = values.map(value => num(value)).slice(-28);
            const width = 260;
            const height = 54;
            if (!clean.length) {
                return `<svg class="sparkline" viewBox="0 0 ${width} ${height}" role="img"><line x1="0" y1="42" x2="${width}" y2="42" stroke="#dbe6eb" stroke-width="2"/></svg>`;
            }
            const max = Math.max(maxValue || 0, ...clean, 1);
            const step = clean.length > 1 ? width / (clean.length - 1) : width;
            const points = clean.map((value, index) => {
                const x = index * step;
                const y = height - 8 - (Math.min(value, max) / max) * (height - 16);
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(" ");
            return `
                <svg class="sparkline" viewBox="0 0 ${width} ${height}" role="img">
                    <line x1="0" y1="${height - 8}" x2="${width}" y2="${height - 8}" stroke="#dbe6eb" stroke-width="2"/>
                    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `;
        }

        function efficiencyScore(bus) {
            let score = 100;
            const loadPercent = (num(bus.passengerCount) / BUS_CAPACITY) * 100;
            const waiting = num(bus.waitingPassengers);
            const traffic = String(bus.trafficLevel || "LOW").toUpperCase();

            if (traffic === "HIGH") score -= 18;
            else if (traffic === "MEDIUM") score -= 8;
            if (loadPercent >= 95) score -= 18;
            else if (loadPercent >= 80) score -= 8;
            if (waiting > 0) score -= Math.min(20, waiting * 2);
            if (num(bus.dwellRemaining) > 30) score -= 8;
            if (bus.reroutingActive || bus.eventType === "REROUTING") score -= 5;
            if (isSupportBus(bus) || bus.supportDecision === "WAIT_FOR_NEXT_BUS") score += 6;

            return Math.max(0, Math.min(100, Math.round(score)));
        }

        function gaugeSvg(score) {
            const color = score >= 80 ? "#1a9c62" : score >= 60 ? "#d98412" : "#d94141";
            return `
                <svg class="gauge" viewBox="0 0 100 60" role="img">
                    <path d="M12 50 A38 38 0 0 1 88 50" fill="none" stroke="#dbe6eb" stroke-width="10" stroke-linecap="round" pathLength="100"/>
                    <path d="M12 50 A38 38 0 0 1 88 50" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="${score} 100"/>
                </svg>
            `;
        }

        function nextStopsForBus(bus) {
            const routeId = normalizeRouteId(bus.routeId);
            const stops = routeData[routeId]?.stops || [];
            if (!bus || !stops.length) return [];

            const currentIndex = Number.isFinite(num(bus.currentRouteIndex, NaN))
                ? Math.floor(num(bus.currentRouteIndex))
                : nearestShapeIndex(routeId, num(bus.latitude), num(bus.longitude));

            return stops
                .filter(stop => stop.routeIndex >= currentIndex)
                .filter(stop => !(routeId === "Route_57" && route57StopAffectedByScenario(routeId, stop)))
                .map(stop => ({ stop, arrival: estimateArrival(bus, routeId, stop) }))
                .filter(item => item.arrival)
                .slice(0, 3);
        }

        function updateBusDetail() {
            const bus = selectedBus();
            const container = document.getElementById("bus-detail");

            if (!bus) {
                container.className = "vehicle-analytics";
                container.innerHTML = `<div class="vehicle-card"><div class="vehicle-card-title">Status</div><div class="decision-summary">Waiting for live telemetry.</div></div>`;
                return;
            }

            container.className = "vehicle-analytics";
            const samples = busSamples[bus.busId] || [];
            const loadValues = samples.map(sample => sample.passengerCount);
            const speedValues = samples.map(sample => sample.speedKmh);
            const score = efficiencyScore(bus);
            const decision = getDecision(bus);
            const nextStops = nextStopsForBus(bus);
            const loadPercent = Math.round((num(bus.passengerCount) / BUS_CAPACITY) * 100);

            container.innerHTML = `
                <div class="vehicle-card">
                    <div class="vehicle-card-title">Route Efficiency</div>
                    <div class="efficiency-row">
                        ${gaugeSvg(score)}
                        <div>
                            <div class="efficiency-score">${score}%</div>
                            <div class="efficiency-note">${escapeHtml(normalizeRouteId(bus.routeId))} · load ${loadPercent}% · ${escapeHtml(bus.trafficLevel || "LOW")} traffic</div>
                        </div>
                    </div>
                </div>
                <div class="vehicle-card">
                    <div class="vehicle-card-title">Passenger Load Trend</div>
                    ${trendSvg(loadValues, getRouteColor(bus.routeId), BUS_CAPACITY)}
                </div>
                <div class="vehicle-card">
                    <div class="vehicle-card-title">Speed Trend</div>
                    ${trendSvg(speedValues, "#0f9faf", 60)}
                </div>
                <div class="vehicle-card">
                    <div class="vehicle-card-title">Next Stops</div>
                    <div class="next-stop-list">
                        ${nextStops.length ? nextStops.map(item => `
                            <div class="next-stop-row">
                                <span>${escapeHtml(item.stop.name)}</span>
                                <b>${escapeHtml(item.arrival.etaLabel)}</b>
                            </div>
                        `).join("") : `<div class="decision-summary">No downstream stop ETA available.</div>`}
                    </div>
                </div>
                <div class="vehicle-card">
                    <div class="vehicle-card-title">Current Decision</div>
                    <div class="decision-summary">${escapeHtml(decision.title)} · ${escapeHtml(decision.pill)}</div>
                </div>
            `;
        }

        function getDecision(bus) {
            if (!bus) {
                return {
                    title: "Waiting for telemetry",
                    pill: "STANDBY",
                    className: "",
                    rows: [["Trigger", "No live bus selected"], ["Support ETA", "Standby"]]
                };
            }

            if (isSupportBus(bus)) {
                return {
                    title: "Support operating",
                    pill: "SUPPORT",
                    className: "support",
                    rows: [
                        ["Status", bus.eventType === "STOP" ? "boarding / dwell" : "continuing service"],
                        ["Capacity", `${num(bus.passengerCount)}/${BUS_CAPACITY}`],
                        ["Target", bus.supportTargetStopName || bus.targetStopName || "route queue"],
                        ["Origin", bus.supportOriginDescription || bus.originDescription || "route standby"]
                    ]
                };
            }

            const reroutingDecision = String(bus.reroutingDecision || bus.reroutingRecommendation?.decisionType || (bus.eventType === "REROUTING" ? "REROUTING_ACTIVE" : "NORMAL"));
            if (route57ScenarioActive() && normalizeRouteId(bus.routeId) === "Route_57") {
                const scenario = displayScenarioForBus(bus);
                const active = reroutingDecision === "REROUTING_ACTIVE";
                const recommended = reroutingDecision === "REROUTE_RECOMMENDED";
                const title = active
                    ? "Rerouting active"
                    : recommended
                        ? "Reroute recommended"
                        : reroutingDecision === "HOLD_ROUTE"
                            ? "Hold normal route"
                            : "Monitor incident";
                return {
                    title,
                    pill: active ? "ACTIVE" : recommended ? "ACTION" : "WATCH",
                    className: active || recommended ? "support" : "warn",
                    rows: [
                        ["Incident", `${incidentIcon(scenario?.incidentType || bus.incidentType)} ${scenario?.title || bus.incidentTitle || "Route incident"}`],
                        ["Route", `${normalizeRouteId(bus.routeId)} · ${scenario?.incidentType || bus.incidentType || "INCIDENT"}`],
                        ["Expected delay", `${num(scenario?.expectedDelayMinutes || bus.expectedDelayMinutes)} min`],
                        ["Passenger impact", bus.passengerImpact || "-"],
                        ["Max walk", bus.maxWalkingDistanceMeters ? `${Math.round(num(bus.maxWalkingDistanceMeters))} m` : "-"],
                        ["Action", active ? "Bus is following alternative corridor" : (bus.reroutingRecommendation?.action || "Use alternative route")]
                    ]
                };
            }

            const queue = num(bus.waitingPassengers);
            const full = num(bus.passengerCount) >= BUS_CAPACITY;

            if (bus.supportDecision === "DISPATCH_SUPPORT_BUS" || (queue > 0 && full)) {
                return {
                    title: "Dispatch support bus",
                    pill: "ACTION",
                    className: "warn",
                    rows: [
                        ["Trigger", bus.supportReason || "capacity full + unserved queue"],
                        ["Queue after support", queue],
                        ["Next regular bus", bus.nextRegularBusId ? `${bus.nextRegularBusId} · ${num(bus.nextRegularBusEtaMinutes).toFixed(1)} min` : "not close"],
                        ["Support ETA", "Operational standby"]
                    ]
                };
            }

            if (["MONITOR_QUEUE", "WAIT_FOR_NEXT_BUS", "REUSE_SUPPORT_BUS", "SUPPORT_OPERATING"].includes(bus.supportDecision) || queue > 0) {
                return {
                    title: bus.supportDecision === "WAIT_FOR_NEXT_BUS" ? "Wait for next bus" : "Monitor queue",
                    pill: "WATCH",
                    className: "warn",
                    rows: [
                        ["Trigger", bus.supportReason || "waiting passengers"],
                        ["Unserved queue", queue],
                        ["Next regular bus", bus.nextRegularBusId ? `${bus.nextRegularBusId} · ${num(bus.nextRegularBusEtaMinutes).toFixed(1)} min` : "not available"],
                        ["Support ETA", "Standby"]
                    ]
                };
            }

            return {
                title: "No intervention",
                pill: "NORMAL",
                className: "",
                rows: [
                    ["Trigger", "normal operation"],
                    ["Support ETA", "Standby"]
                ]
            };
        }

        function updateDecisionCenter() {
            const decision = getDecision(selectedBus());
            document.getElementById("decision-center").innerHTML = `
                <div class="decision-title">
                    <span>${escapeHtml(decision.title)}</span>
                    <span class="decision-pill ${decision.className}">${escapeHtml(decision.pill)}</span>
                </div>
                ${decision.rows.map(row => `
                    <div class="decision-line">
                        <span>${escapeHtml(row[0])}</span>
                        <b>${escapeHtml(row[1])}</b>
                    </div>
                `).join("")}
            `;
        }

        function buildOperationalAlerts() {
            const alerts = [];
            const scenarioBus = activeScenarioBus();

            if (route57ScenarioActive()) {
                const scenario = displayScenarioForBus(scenarioBus) || SCENARIOS[selectedScenarioId];
                const decision = String(scenarioBus?.reroutingDecision || (scenarioBus?.eventType === "REROUTING" ? "REROUTING_ACTIVE" : "MONITOR"));
                alerts.push({
                    level: "high",
                    title: `${incidentIcon(scenario?.incidentType)} ${scenario?.title || "Route_57 incident"}`,
                    meta: `Route_57 · ${scenario?.severity || "HIGH"} impact · Expected delay ${num(scenario?.expectedDelayMinutes || scenarioBus?.expectedDelayMinutes)} min`,
                    action: decision === "REROUTING_ACTIVE" || scenarioBus?.eventType === "REROUTING" ? "Reroute active" : "Alternative corridor active"
                });
            }

            buildRouteDecisionItems()
                .filter(item => item.kind !== "scenario")
                .slice(0, 4)
                .forEach(item => alerts.push({
                    level: item.level,
                    title: item.title,
                    meta: item.meta,
                    action: item.action
                }));

            return alerts.slice(0, 5);
        }

        function buildRouteDecisionItems() {
            const items = [];
            const seen = new Set();

            if (route57ScenarioActive()) {
                const bus = activeScenarioBus();
                const scenario = displayScenarioForBus(bus) || SCENARIOS[selectedScenarioId];
                const active = bus?.eventType === "REROUTING" || bus?.reroutingDecision === "REROUTING_ACTIVE";
                items.push({
                    kind: "scenario",
                    routeId: "Route_57",
                    level: "high",
                    title: `${incidentIcon(scenario?.incidentType)} Route_57 - ${active ? "Reroute active" : "Reroute corridor ready"}`,
                    meta: `${scenario?.severity || "HIGH"} impact · ${scenario?.title || "Scenario active"}`,
                    action: active ? "Reroute active" : "Alternative corridor active"
                });
            }

            latestBuses.forEach(bus => {
                const routeId = normalizeRouteId(bus.routeId);
                const queue = num(bus.waitingPassengers);
                const keyBase = `${routeId}:${bus.currentStopName || "route"}`;

                if (isSupportBus(bus)) {
                    const key = `${routeId}:support`;
                    if (seen.has(key)) return;
                    seen.add(key);
                    items.push({
                        kind: "support",
                        routeId,
                        level: "info",
                        title: "\uD83D\uDFE2 Support operating",
                        meta: `${routeId} · Queue mitigation in progress`,
                        action: bus.eventType === "STOP" ? "Boarding passengers" : "Continuing service"
                    });
                } else if (bus.supportDecision === "DISPATCH_SUPPORT_BUS" || (queue >= 5 && num(bus.passengerCount) >= BUS_CAPACITY)) {
                    if (seen.has(`${keyBase}:dispatch`)) return;
                    seen.add(`${keyBase}:dispatch`);
                    items.push({
                        kind: "dispatch",
                        routeId,
                        level: "high",
                        title: "Support bus needed",
                        meta: `${routeId} · Queue ${queue} at ${bus.currentStopName || "current stop"}`,
                        action: "Dispatch support bus"
                    });
                } else if (bus.supportDecision === "WAIT_FOR_NEXT_BUS") {
                    if (seen.has(`${keyBase}:wait`)) return;
                    seen.add(`${keyBase}:wait`);
                    items.push({
                        kind: "wait",
                        routeId,
                        level: "info",
                        title: "Wait for next regular bus",
                        meta: `${routeId} · ${bus.nextRegularBusId || "Next bus"} ETA ${num(bus.nextRegularBusEtaMinutes).toFixed(1)} min`,
                        action: "Monitor queue"
                    });
                } else if (queue > 0) {
                    if (seen.has(`${keyBase}:monitor`)) return;
                    seen.add(`${keyBase}:monitor`);
                    items.push({
                        kind: "queue",
                        routeId,
                        level: "info",
                        title: "Monitor queue",
                        meta: `${routeId} · ${queue} unserved passengers`,
                        action: "Monitor"
                    });
                }
            });

            return items.slice(0, 5);
        }

        function updateSystemAlerts() {
            const container = document.getElementById("system-alerts");
            const alerts = buildOperationalAlerts();

            if (!alerts.length) {
                container.innerHTML = `
                    <div class="panel-title" style="margin-bottom:4px">System Alerts</div>
                    <div class="alert-meta">No active incident or support intervention.</div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="panel-title" style="margin-bottom:4px">System Alerts</div>
                ${alerts.map(alert => `
                    <div class="alert-card ${alert.level === "high" ? "high" : ""}">
                        <div class="alert-title">${escapeHtml(alert.title)}</div>
                        <div class="alert-meta">${escapeHtml(alert.meta)}</div>
                        <div class="alert-meta"><b>Action:</b> ${escapeHtml(alert.action)}</div>
                    </div>
                `).join("")}
            `;
        }

        function updateAnalytics() {
            const byRoute = aggregateRoutes();
            document.getElementById("passenger-flow").innerHTML = Object.entries(byRoute).map(([routeId, stats]) => {
                const onboard = stats.buses.reduce((sum, bus) => sum + num(bus.passengerCount), 0);
                const percent = Math.min(100, Math.round((onboard / Math.max(1, stats.buses.length * BUS_CAPACITY)) * 100));
                return `
                    <div class="bar-row">
                        <span>${escapeHtml(routeId)}</span>
                        <div class="bar-track"><div class="bar-fill" style="width:${percent}%; background:${getRouteColor(routeId)}"></div></div>
                        <b>${onboard}</b>
                    </div>
                `;
            }).join("");

        }

        function rememberBusPoints() {
            latestBuses.forEach(bus => {
                lastBusPoints[bus.busId] = {
                    latitude: num(bus.latitude),
                    longitude: num(bus.longitude),
                    routeId: bus.routeId
                };
            });
        }

        function renderAll() {
            syncSelectedBus();
            updateMarkers();
            renderRouteControls();
            renderStaticRouteLayers();
            renderTrafficSections();
            renderScenarioLayers();
            updateKpis();
            updateBusDetail();
            updateDecisionCenter();
            updateSystemAlerts();
            updateAnalytics();
        }

        async function fetchBuses() {
            if (isFetchingBuses) return;
            isFetchingBuses = true;

            try {
                const response = await fetch(`${API_BASE}/api/buses/latest`);
                const data = await response.json();
                latestBuses = Array.isArray(data) ? data.filter(bus => bus.latitude && bus.longitude) : [];
                recordBusSamples();
                renderAll();
                rememberBusPoints();
            } catch (error) {
                console.error("Error fetching latest bus data:", error);
            } finally {
                isFetchingBuses = false;
            }
        }

        async function fetchOverviewMetrics() {
            try {
                const response = await fetch(`${API_BASE}/api/system/overview`);
                if (!response.ok) return;
                await response.json();
            } catch (error) {
                console.warn("System overview unavailable:", error);
            }
        }

        async function fetchAstanaWeather() {
            try {
                const response = await fetch(`${API_BASE}/api/weather/astana`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                document.getElementById("weather-widget").textContent =
                    `Astana ${Math.round(num(data.temperatureC))} C, wind ${Math.round(num(data.windSpeedKmh))} km/h`;
            } catch (error) {
                document.getElementById("weather-widget").textContent = "Astana weather unavailable";
            }
        }

        async function fetchRoute57ScenarioControl() {
            try {
                const response = await fetch(`${API_BASE}/api/scenario/route57`);
                if (!response.ok) return;
                const data = await response.json();
                if (data.scenarioId && SCENARIOS[data.scenarioId] !== undefined) {
                    selectedScenarioId = data.scenarioId;
                    localStorage.setItem("dtScenarioId", selectedScenarioId);
                    document.getElementById("scenario-select").value = selectedScenarioId;
                }
            } catch (error) {
                console.warn("Scenario control API unavailable:", error);
            }
        }

        async function updateRoute57ScenarioControl(scenarioId) {
            try {
                await fetch(`${API_BASE}/api/scenario/route57`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ scenarioId })
                });
            } catch (error) {
                console.warn("Scenario control update unavailable:", error);
            }
        }

        document.getElementById("traffic-toggle").addEventListener("click", () => {
            trafficLayerEnabled = !trafficLayerEnabled;
            const button = document.getElementById("traffic-toggle");
            button.textContent = trafficLayerEnabled ? "Traffic layer ON" : "Traffic layer OFF";
            button.classList.toggle("off", !trafficLayerEnabled);
            renderTrafficSections();
        });

        document.getElementById("bus-select").addEventListener("change", event => {
            selectedBusId = event.target.value;
            renderAll();
            const marker = busMarkers[selectedBusId];
            if (marker) {
                map.setView(marker.getLatLng(), 14);
                marker.openPopup();
            }
        });

        document.getElementById("scenario-select").addEventListener("change", event => {
            selectedScenarioId = event.target.value;
            localStorage.setItem("dtScenarioId", selectedScenarioId);
            updateRoute57ScenarioControl(selectedScenarioId);
            renderAll();
        });

        setInterval(() => {
            document.getElementById("current-time").textContent = new Date().toLocaleTimeString();
        }, 1000);

        async function boot() {
            document.getElementById("current-time").textContent = new Date().toLocaleTimeString();
            document.getElementById("scenario-select").value = selectedScenarioId;
            await fetchRoute57ScenarioControl();
            await loadAllRouteAssets();
            await fetchAstanaWeather();
            await fetchBuses();
            setInterval(fetchBuses, 2000);
            setInterval(fetchOverviewMetrics, 5000);
            setInterval(fetchAstanaWeather, 1800000);
            setTimeout(() => map.invalidateSize(), 100);
        }

        boot();
    </script>
</body>

</html>
