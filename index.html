<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Transport Digital Twin</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f4f7f8;
            --surface: #ffffff;
            --surface-soft: #f8fbfc;
            --border: #dde8ec;
            --text: #152432;
            --muted: #6f8190;
            --blue: #2367e8;
            --teal: #0f9faf;
            --green: #1a9c62;
            --amber: #d98412;
            --red: #d94141;
            --shadow: 0 10px 28px rgba(38, 67, 88, 0.09);
            --shadow-soft: 0 4px 14px rgba(38, 67, 88, 0.07);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            letter-spacing: 0;
        }

        body {
            overflow: auto;
        }

        button,
        select {
            font: inherit;
        }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-rows: 64px 82px minmax(560px, 1fr) auto;
            gap: 14px;
            padding: 14px;
        }

        .topbar,
        .panel,
        .kpi-card,
        .analytics {
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            border-radius: 16px;
            padding: 0 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--blue), var(--teal));
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 14px;
            flex: 0 0 auto;
        }

        .brand-title {
            font-weight: 800;
            font-size: 17px;
            line-height: 1.15;
            white-space: nowrap;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
            white-space: nowrap;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .live-badge,
        .time-pill,
        .toggle-btn {
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-soft);
            color: var(--text);
            font-weight: 700;
            font-size: 12px;
            padding: 8px 12px;
            line-height: 1;
        }

        .live-badge {
            color: var(--green);
            background: #ebf8f1;
            border-color: #caecd9;
        }

        .live-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 7px;
            border-radius: 50%;
            background: var(--green);
        }

        .toggle-btn {
            cursor: pointer;
            color: #155c68;
            background: #ecfbfd;
            border-color: #bfe9ef;
        }

        .toggle-btn.off {
            color: var(--muted);
            background: #f3f5f6;
            border-color: var(--border);
        }

        .kpi-strip {
            display: grid;
            grid-template-columns: repeat(4, minmax(140px, 1fr));
            gap: 12px;
        }

        .kpi-card {
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-width: 0;
        }

        .kpi-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
        }

        .kpi-label {
            margin-top: 4px;
            color: var(--muted);
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
        }

        .kpi-accent {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #eef5ff;
            color: var(--blue);
            display: grid;
            place-items: center;
            font-weight: 800;
            flex: 0 0 auto;
        }

        .main-grid {
            min-height: 0;
            display: grid;
            grid-template-columns: 292px minmax(420px, 1fr) 340px;
            gap: 14px;
        }

        .panel {
            min-height: 0;
            border-radius: 16px;
            padding: 14px;
            overflow: auto;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 800;
            color: #425463;
            text-transform: uppercase;
            margin: 0 0 12px;
        }

        .route-card {
            border: 1px solid var(--border);
            background: var(--surface-soft);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .route-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .route-name {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 800;
        }

        .route-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .route-status {
            font-size: 11px;
            font-weight: 800;
            border-radius: 999px;
            padding: 5px 8px;
            background: #ecf8f0;
            color: var(--green);
        }

        .route-status.warn {
            background: #fff5e6;
            color: var(--amber);
        }

        .route-status.danger {
            background: #ffeded;
            color: var(--red);
        }

        .route-status.reroute {
            background: #e7fbf6;
            color: #078a78;
        }

        .route-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 11px 0;
        }

        .mini-stat {
            border: 1px solid #e6eef2;
            background: #fff;
            border-radius: 10px;
            padding: 8px;
        }

        .mini-stat span {
            display: block;
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .mini-stat b {
            display: block;
            margin-top: 4px;
            font-size: 15px;
        }

        .route-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .small-btn {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            color: #496071;
            padding: 8px 9px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
        }

        .small-btn.active {
            color: #0d6c78;
            background: #e9fafd;
            border-color: #bde9ef;
        }

        .map-wrap {
            position: relative;
            min-height: 0;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #dfeaec;
            box-shadow: var(--shadow);
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 100%;
        }

        .map-chip {
            position: absolute;
            z-index: 450;
            left: 14px;
            top: 14px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--border);
            border-radius: 999px;
            box-shadow: var(--shadow-soft);
            padding: 8px 12px;
            color: #526271;
            font-size: 12px;
            font-weight: 800;
        }

        .weather {
            position: absolute;
            right: 14px;
            top: 14px;
            z-index: 450;
            max-width: 210px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
            padding: 9px 11px;
            color: #526271;
            font-size: 12px;
            font-weight: 700;
        }

        .operator-select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
            padding: 10px 12px;
            color: var(--text);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .operator-block {
            margin-bottom: 12px;
        }

        .operator-label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .system-alerts {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-soft);
            padding: 10px;
            margin-bottom: 12px;
        }

        .alert-card {
            border: 1px solid #e4edf1;
            border-left: 4px solid var(--amber);
            border-radius: 10px;
            background: #fff;
            padding: 9px 10px;
            margin-top: 8px;
        }

        .alert-card.high {
            border-left-color: var(--red);
        }

        .alert-title {
            font-weight: 800;
            font-size: 12px;
            line-height: 1.35;
        }

        .alert-meta {
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .vehicle-analytics {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vehicle-card {
            border: 1px solid var(--border);
            background: var(--surface-soft);
            border-radius: 12px;
            padding: 10px;
        }

        .vehicle-card-title {
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .efficiency-row {
            display: grid;
            grid-template-columns: 92px 1fr;
            gap: 10px;
            align-items: center;
        }

        .gauge {
            width: 92px;
            height: 52px;
        }

        .efficiency-score {
            font-size: 26px;
            font-weight: 800;
            line-height: 1;
        }

        .efficiency-note {
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            line-height: 1.35;
        }

        .sparkline {
            width: 100%;
            height: 58px;
            display: block;
        }

        .next-stop-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .next-stop-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            color: #425463;
        }

        .next-stop-row b {
            color: var(--text);
            white-space: nowrap;
        }

        .decision-summary {
            font-size: 12px;
            color: #425463;
            line-height: 1.45;
        }

        .info-tile,
        .decision-box,
        .analytics {
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface-soft);
            padding: 10px;
        }

        .info-tile span {
            display: block;
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .info-tile b {
            display: block;
            margin-top: 4px;
            font-size: 14px;
            word-break: break-word;
        }

        .decision-box {
            margin-top: 12px;
        }

        .decision-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .decision-pill {
            border-radius: 999px;
            padding: 5px 8px;
            background: #edf6ff;
            color: var(--blue);
            font-size: 10px;
            font-weight: 800;
        }

        .decision-pill.warn {
            background: #fff4e1;
            color: var(--amber);
        }

        .decision-pill.support {
            background: #e8f8ef;
            color: var(--green);
        }

        .decision-line {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-top: 1px solid #e2eaee;
            padding-top: 8px;
            margin-top: 8px;
            color: #465867;
            font-size: 12px;
        }

        .decision-line b {
            color: var(--text);
            text-align: right;
        }

        .analytics {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            align-items: stretch;
        }

        .analytics h3 {
            margin: 0 0 8px;
            font-size: 12px;
            text-transform: uppercase;
            color: #425463;
        }

        .issue-list,
        .compact-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            color: #4b5e6e;
        }

        .issue-item,
        .compact-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-radius: 9px;
            background: #fff;
            border: 1px solid #e4edf1;
            padding: 8px 9px;
        }

        .issue-item small {
            display: inline-block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
        }

        .compact-row small {
            display: inline-block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
        }

        .incident-marker {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff4e1;
            border: 2px solid #e15a24;
            box-shadow: 0 8px 18px rgba(79, 43, 22, 0.18);
            font-size: 16px;
        }

        .incident-label {
            border: 1px solid #f2c68c;
            background: rgba(255, 248, 235, 0.96);
            color: #9a4f0f;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: var(--shadow-soft);
        }

        .roadworks-line {
            animation: dash-flow 1.2s linear infinite;
        }

        @keyframes dash-flow {
            to {
                stroke-dashoffset: -24;
            }
        }

        .bar-row {
            display: grid;
            grid-template-columns: 92px minmax(180px, 1fr) 58px;
            gap: 12px;
            align-items: center;
            font-size: 13px;
            color: #526271;
            margin-bottom: 10px;
        }

        .bar-track {
            height: 12px;
            border-radius: 999px;
            background: #e8eef1;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--teal);
        }

        .bus-icon {
            width: 31px;
            height: 31px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 800;
            border: 2px solid #fff;
            box-shadow: 0 5px 16px rgba(24, 51, 72, 0.25);
            font-size: 11px;
        }

        .bus-icon.selected {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            outline: 3px solid rgba(35, 103, 232, 0.22);
        }

        .stop-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(30, 56, 73, 0.16);
        }

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .popup-title {
            font-weight: 800;
            margin-bottom: 6px;
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 12px;
            min-width: 170px;
            margin: 3px 0;
        }

        .popup-row span {
            color: var(--muted);
        }

        .eta-popup {
            width: 280px;
            max-height: 330px;
            overflow: auto;
        }

        .eta-stop-title {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .eta-routes {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .eta-route-group {
            border-top: 1px solid #e4edf1;
            padding-top: 7px;
            margin-top: 7px;
        }

        .eta-route-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .eta-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: start;
            padding: 5px 0;
            font-size: 12px;
        }

        .eta-meta {
            color: var(--muted);
            font-size: 10px;
            margin-top: 2px;
        }

        .eta-badge {
            border-radius: 999px;
            padding: 3px 7px;
            background: #ecf8f0;
            color: var(--green);
            font-size: 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        .eta-badge.delayed,
        .eta-badge.rerouted {
            background: #fff4e1;
            color: var(--amber);
        }

        .eta-badge.support {
            background: #e7fbf6;
            color: #078a78;
        }

        .eta-badge.arriving {
            background: #edf6ff;
            color: var(--blue);
        }

        @media (max-width: 1180px) {
            body {
                overflow: auto;
            }

            .app {
                height: auto;
                min-height: 100vh;
                grid-template-rows: auto auto auto auto;
            }

            .kpi-strip,
            .main-grid,
            .analytics {
                grid-template-columns: 1fr;
            }

            .map-wrap {
                height: 560px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">DT</div>
                <div>
                    <div class="brand-title">DigitalTwin / Smart City Transport Digital Twin</div>
                    <div class="brand-subtitle">Astana Public Transport Monitoring System</div>
                </div>
            </div>
            <div class="top-actions">
                <button id="traffic-toggle" class="toggle-btn">Traffic layer ON</button>
                <span class="live-badge"><span class="live-dot"></span>LIVE</span>
                <span id="current-time" class="time-pill">--:--:--</span>
            </div>
        </header>

        <section class="kpi-strip">
            <div class="kpi-card">
                <div>
                    <div id="kpi-active-buses" class="kpi-value">0</div>
                    <div class="kpi-label">Active buses</div>
                </div>
                <div class="kpi-accent">B</div>
            </div>
            <div class="kpi-card">
                <div>
                    <div id="kpi-active-routes" class="kpi-value">0</div>
                    <div class="kpi-label">Active routes</div>
                </div>
                <div class="kpi-accent">R</div>
            </div>
            <div class="kpi-card">
                <div>
                    <div id="kpi-alerts" class="kpi-value">0</div>
                    <div class="kpi-label">Active alerts</div>
                </div>
                <div class="kpi-accent">A</div>
            </div>
            <div class="kpi-card">
                <div>
                    <div id="kpi-decisions" class="kpi-value">0</div>
                    <div class="kpi-label">Active decisions</div>
                </div>
                <div class="kpi-accent">D</div>
            </div>
        </section>

        <main class="main-grid">
            <aside class="panel">
                <h2 class="panel-title">Route Status</h2>
                <div id="route-status-list"></div>
            </aside>

            <section class="map-wrap">
                <div id="map"></div>
                <div id="map-mode" class="map-chip">Bus markers and stops visible</div>
                <div id="weather-widget" class="weather">Astana weather loading</div>
            </section>

            <aside class="panel">
                <h2 class="panel-title">Selected Vehicle Analytics</h2>
                <div class="operator-block">
                    <label class="operator-label" for="scenario-select">Route_57 scenario</label>
                    <select id="scenario-select" class="operator-select">
                        <option value="NONE">No scenario</option>
                        <option value="R57_ROADWORKS_SARAISHYK" selected>Route_57: ROADWORKS</option>
                        <option value="R57_TRAFFIC_JAM_SARAISHYK">Route_57: TRAFFIC_JAM</option>
                        <option value="R57_SECURITY_CLOSURE_MINISTRY">Route_57: SECURITY_CLOSURE</option>
                    </select>
                </div>

                <div id="system-alerts" class="system-alerts"></div>

                <div class="operator-block">
                    <label class="operator-label" for="bus-select">Selected vehicle</label>
                    <select id="bus-select" class="operator-select">
                        <option value="Bus_1">Bus_1</option>
                    </select>
                </div>

                <div id="bus-detail" class="info-grid"></div>

                <div id="decision-center" class="decision-box"></div>
            </aside>
        </main>

        <section class="analytics">
            <div>
                <h3>Passenger Flow</h3>
                <div id="passenger-flow"></div>
            </div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        const BUS_CAPACITY = 60;

        const SCENARIOS = {
            NONE: null,
            R57_ROADWORKS_SARAISHYK: {
                scenarioId: "R57_ROADWORKS_SARAISHYK",
                routeId: "Route_57",
                incidentType: "ROADWORKS",
                title: "Roadworks near Saraishyk / Akmeshit corridor",
                description: "Lane maintenance and severe local disruption near Saraishyk, Akmeshit and Ministry district.",
                severity: "HIGH",
                expectedDelayMinutes: 8,
                affectedSequences: [9, 10, 11]
            },
            R57_TRAFFIC_JAM_SARAISHYK: {
                scenarioId: "R57_TRAFFIC_JAM_SARAISHYK",
                routeId: "Route_57",
                incidentType: "TRAFFIC_JAM",
                title: "Severe congestion near Saraishyk / Akmeshit",
                description: "Traffic jam causing major delay on the normal Route_57 corridor.",
                severity: "HIGH",
                expectedDelayMinutes: 7,
                affectedSequences: [9, 10, 11]
            },
            R57_SECURITY_CLOSURE_MINISTRY: {
                scenarioId: "R57_SECURITY_CLOSURE_MINISTRY",
                routeId: "Route_57",
                incidentType: "SECURITY_CLOSURE",
                title: "Security closure near Ministry district",
                description: "Temporary road restriction near government area.",
                severity: "HIGH",
                expectedDelayMinutes: 10,
                affectedSequences: [11]
            }
        };

        const ROUTES = {
            Route_57: {
                id: "Route_57",
                label: "Route 57",
                color: "#2367e8",
                shapeFile: "data/routes/route_57/route_57_shape.csv",
                stopsFile: "data/routes/route_57/route_57_stops.csv",
                altShapeFile: "data/routes/route_57/route_57_shape_alt.csv",
                altStopsFile: "data/routes/route_57/route_57_stops_alt.csv",
                headwaySeconds: 420,
                showFullRoute: false,
                showStops: true
            },
            Route_10: {
                id: "Route_10",
                label: "Route 10",
                color: "#0f9faf",
                shapeFile: "data/routes/route_10/route_10_shape.csv",
                stopsFile: "data/routes/route_10/route_10_stops.csv",
                headwaySeconds: 480,
                showFullRoute: false,
                showStops: true
            },
            Route_47: {
                id: "Route_47",
                label: "Route 47",
                color: "#7a55d8",
                shapeFile: "data/routes/route_47/route_47_shape.csv",
                stopsFile: "data/routes/route_47/route_47_stops.csv",
                headwaySeconds: 540,
                showFullRoute: false,
                showStops: true
            }
        };

        const trafficColors = {
            LOW: "#20a464",
            MEDIUM: "#d98412",
            HIGH: "#d94141",
            UNKNOWN: "#8da1ad"
        };

        const map = L.map("map", { zoomControl: true }).setView([51.13, 71.43], 12);

        L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
            attribution: "&copy; OpenStreetMap &copy; CARTO",
            subdomains: "abcd",
            maxZoom: 20
        }).addTo(map);

        const routeData = {};
        const fullRouteLayers = {};
        const stopLayers = {};
        const trafficSectionLayers = {};
        const scenarioLayer = L.layerGroup().addTo(map);
        const busMarkers = {};
        const lastBusPoints = {};
        const busSamples = {};

        let latestBuses = [];
        let selectedBusId = "Bus_1";
        let trafficLayerEnabled = true;
        let isFetchingBuses = false;
        let selectedScenarioId = localStorage.getItem("dtScenarioId") || "R57_ROADWORKS_SARAISHYK";

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function normalizeRouteId(routeId) {
            return String(routeId || "").replace(/_SUPPORT$/, "");
        }

        function isSupportBus(bus) {
            return String(bus?.busId || "").startsWith("Support_") || String(bus?.routeId || "").endsWith("_SUPPORT");
        }

        function num(value, fallback = 0) {
            const number = Number(value);
            return Number.isFinite(number) ? number : fallback;
        }

        function speedKmh(bus) {
            return num(bus?.speed) * 3.6;
        }

        function normalizeStopName(value) {
            return String(value || "")
                .trim()
                .toLowerCase()
                .replace(/\u0451/g, "\u0435")
                .replace(/\u0401/g, "\u0435")
                .replace(/\s+/g, " ");
        }

        function distanceMeters(latA, lonA, latB, lonB) {
            const earthRadius = 6371000;
            const toRad = degrees => degrees * Math.PI / 180;
            const dLat = toRad(latB - latA);
            const dLon = toRad(lonB - lonA);
            const a = Math.sin(dLat / 2) ** 2
                + Math.cos(toRad(latA)) * Math.cos(toRad(latB)) * Math.sin(dLon / 2) ** 2;
            return earthRadius * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function enrichRouteData(data) {
            let cumulative = 0;
            data.shape.forEach((point, index) => {
                if (index > 0) {
                    const previous = data.shape[index - 1];
                    cumulative += distanceMeters(previous.latitude, previous.longitude, point.latitude, point.longitude);
                }
                point.routeIndex = index;
                point.distanceMeters = cumulative;
            });

            data.stops.forEach(stop => {
                let bestIndex = 0;
                let bestDistance = Infinity;
                data.shape.forEach((point, index) => {
                    const distance = distanceMeters(stop.latitude, stop.longitude, point.latitude, point.longitude);
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        bestIndex = index;
                    }
                });
                stop.routeIndex = bestIndex;
                stop.distanceToRoute = bestDistance;
                stop.normalizedName = normalizeStopName(stop.name);
            });
        }

        function getRouteConfig(routeId) {
            return ROUTES[normalizeRouteId(routeId)] || ROUTES.Route_57;
        }

        function getRouteColor(routeId) {
            return getRouteConfig(routeId).color;
        }

        function getTrafficColor(level) {
            return trafficColors[String(level || "UNKNOWN").toUpperCase()] || trafficColors.UNKNOWN;
        }

        function splitCsvLine(line, delimiter) {
            const result = [];
            let current = "";
            let quoted = false;

            for (let index = 0; index < line.length; index += 1) {
                const char = line[index];
                const next = line[index + 1];

                if (char === '"' && quoted && next === '"') {
                    current += '"';
                    index += 1;
                } else if (char === '"') {
                    quoted = !quoted;
                } else if (char === delimiter && !quoted) {
                    result.push(current.trim());
                    current = "";
                } else {
                    current += char;
                }
            }

            result.push(current.trim());
            return result;
        }

        function parseCsv(text) {
            const clean = String(text || "").replace(/^\uFEFF/, "").trim();
            if (!clean) return [];

            const lines = clean.split(/\r?\n/).filter(Boolean);
            const delimiter = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ";" : ",";
            const headers = splitCsvLine(lines[0], delimiter).map(header => header.trim().toLowerCase());

            return lines.slice(1).map(line => {
                const values = splitCsvLine(line, delimiter);
                const row = {};
                headers.forEach((header, index) => {
                    row[header] = values[index];
                });
                return row;
            });
        }

        function pick(row, names) {
            for (const name of names) {
                const key = Object.keys(row).find(candidate => candidate === name || candidate.replace(/\s+/g, "_") === name);
                if (key && row[key] !== undefined && row[key] !== "") return row[key];
            }
            return undefined;
        }

        async function fetchCsv(path) {
            const response = await fetch(path);
            if (!response.ok) throw new Error(`${path} returned ${response.status}`);
            return parseCsv(await response.text());
        }

        async function loadRouteAssets(route) {
            const data = {
                shape: [],
                stops: [],
                altShape: [],
                altStops: [],
                hasShape: false,
                hasStops: false,
                hasAltShape: false,
                hasAltStops: false
            };

            try {
                const rows = await fetchCsv(route.shapeFile);
                data.shape = rows
                    .map(row => ({
                        sequence: num(pick(row, ["point_sequence", "sequence", "id"])),
                        latitude: num(pick(row, ["latitude", "lat"])),
                        longitude: num(pick(row, ["longitude", "lon", "lng"]))
                    }))
                    .filter(point => point.latitude && point.longitude)
                    .sort((a, b) => a.sequence - b.sequence);
                data.hasShape = data.shape.length > 1;
            } catch (error) {
                console.warn(`${route.id} shape not loaded:`, error);
            }

            try {
                const rows = await fetchCsv(route.stopsFile);
                data.stops = rows
                    .map(row => ({
                        sequence: num(pick(row, ["stop_sequence", "sequence", "id"])),
                        name: pick(row, ["stop_name", "name", "stop"]) || "Stop",
                        latitude: num(pick(row, ["latitude", "lat"])),
                        longitude: num(pick(row, ["longitude", "lon", "lng"])),
                        demandLevel: String(pick(row, ["demand_level", "demand"]) || "MEDIUM").toUpperCase()
                    }))
                    .filter(stop => stop.latitude && stop.longitude)
                    .sort((a, b) => a.sequence - b.sequence);
                data.hasStops = data.stops.length > 0;
            } catch (error) {
                console.warn(`${route.id} stops not loaded:`, error);
            }

            if (route.altShapeFile) {
                try {
                    const rows = await fetchCsv(route.altShapeFile);
                    data.altShape = rows
                        .map(row => ({
                            sequence: num(pick(row, ["point_sequence", "sequence", "id"])),
                            latitude: num(pick(row, ["latitude", "lat"])),
                            longitude: num(pick(row, ["longitude", "lon", "lng"]))
                        }))
                        .filter(point => point.latitude && point.longitude)
                        .sort((a, b) => a.sequence - b.sequence);
                    data.hasAltShape = data.altShape.length > 1;
                } catch (error) {
                    console.warn(`${route.id} alternative shape not loaded:`, error);
                }
            }

            if (route.altStopsFile) {
                try {
                    const rows = await fetchCsv(route.altStopsFile);
                    data.altStops = rows
                        .map(row => ({
                            sequence: num(pick(row, ["stop_sequence", "sequence", "id"])),
                            name: pick(row, ["stop_name", "name", "stop"]) || "Alternative stop",
                            latitude: num(pick(row, ["latitude", "lat"])),
                            longitude: num(pick(row, ["longitude", "lon", "lng"])),
                            demandLevel: String(pick(row, ["demand_level", "demand"]) || "MEDIUM").toUpperCase()
                        }))
                        .filter(stop => stop.latitude && stop.longitude)
                        .sort((a, b) => a.sequence - b.sequence);
                    data.hasAltStops = data.altStops.length > 0;
                } catch (error) {
                    console.warn(`${route.id} alternative stops not loaded:`, error);
                }
            }

            if (data.hasShape) enrichRouteData(data);
            routeData[route.id] = data;
        }

        async function loadAllRouteAssets() {
            await Promise.all(Object.values(ROUTES).map(loadRouteAssets));
            renderRouteControls();
            renderStaticRouteLayers();
        }

        function makeStopIcon(route) {
            return L.divIcon({
                className: "",
                html: `<div class="stop-dot" style="background:${route.color}"></div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6],
                popupAnchor: [0, -8]
            });
        }

        function makeBusIcon(bus) {
            const support = isSupportBus(bus);
            const selected = bus.busId === selectedBusId;
            const background = support ? "#1a9c62" : getTrafficColor(bus.trafficLevel);
            const label = support ? "S" : String(normalizeRouteId(bus.routeId)).replace("Route_", "");

            return L.divIcon({
                className: "",
                html: `<div class="bus-icon ${selected ? "selected" : ""}" style="background:${background}">${escapeHtml(label)}</div>`,
                iconSize: selected ? [40, 40] : [31, 31],
                iconAnchor: selected ? [20, 20] : [15, 15],
                popupAnchor: [0, -18]
            });
        }

        function compactPopup(bus) {
            const role = isSupportBus(bus) ? "SUPPORT" : "MAIN";
            return `
                <div>
                    <div class="popup-title">${escapeHtml(bus.busId)} <span style="color:${getRouteColor(bus.routeId)}">${escapeHtml(normalizeRouteId(bus.routeId))}</span></div>
                    <div class="popup-row"><span>Role</span><b>${role}</b></div>
                    <div class="popup-row"><span>Speed</span><b>${speedKmh(bus).toFixed(1)} km/h</b></div>
                    <div class="popup-row"><span>Passengers</span><b>${num(bus.passengerCount)}/${BUS_CAPACITY}</b></div>
                    <div class="popup-row"><span>Event</span><b>${escapeHtml(bus.eventType || "-")}</b></div>
                    <div class="popup-row"><span>Traffic</span><b>${escapeHtml(bus.trafficLevel || "-")}</b></div>
                    <div class="popup-row"><span>Stop</span><b>${escapeHtml(bus.currentStopName || "-")}</b></div>
                </div>
            `;
        }

        function renderStaticRouteLayers() {
            Object.values(fullRouteLayers).forEach(layer => map.removeLayer(layer));
            Object.values(stopLayers).forEach(layer => map.removeLayer(layer));

            for (const route of Object.values(ROUTES)) {
                const data = routeData[route.id] || {};

                const fullLayer = L.layerGroup();
                if (route.showFullRoute && data.shape?.length > 1) {
                    const bounds = route.id === "Route_57" && route57ScenarioActive() ? route57AffectedBounds() : null;
                    const hasBlockedSegment = Boolean(bounds);
                    const blockedStart = bounds ? Math.max(0, Math.floor(num(bounds.start, -1))) : -1;
                    const blockedEnd = bounds ? Math.min(data.shape.length - 1, Math.floor(num(bounds.end, -1))) : -1;
                    const drawSegment = points => {
                        if (points.length <= 1) return;
                        L.polyline(points.map(point => [point.latitude, point.longitude]), {
                            color: route.color,
                            weight: 4,
                            opacity: hasBlockedSegment ? 0.38 : 0.55,
                            lineCap: "round",
                            lineJoin: "round"
                        }).addTo(fullLayer);
                    };

                    if (hasBlockedSegment && blockedStart >= 0 && blockedEnd > blockedStart) {
                        drawSegment(data.shape.slice(0, blockedStart + 1));
                        drawSegment(data.shape.slice(blockedEnd));
                    } else {
                        drawSegment(data.shape);
                    }

                    fullLayer.addTo(map);
                }
                fullRouteLayers[route.id] = fullLayer;

                const stopLayer = L.layerGroup();
                if (route.showStops && data.stops?.length) {
                    data.stops.forEach(stop => {
                        const marker = L.marker([stop.latitude, stop.longitude], { icon: makeStopIcon(route) })
                            .bindPopup(buildStopEtaPopup(stop, route.id));

                        marker.on("click", () => {
                            marker.setPopupContent(buildStopEtaPopup(stop, route.id));
                        });

                        marker.addTo(stopLayer);
                    });
                    stopLayer.addTo(map);
                }
                stopLayers[route.id] = stopLayer;
            }
        }

        function distanceSquared(latA, lonA, latB, lonB) {
            const dLat = latA - latB;
            const dLon = lonA - lonB;
            return dLat * dLat + dLon * dLon;
        }

        function nearestShapeIndex(routeId, latitude, longitude) {
            const shape = routeData[routeId]?.shape || [];
            if (!shape.length) return -1;

            let bestIndex = 0;
            let bestDistance = Infinity;

            shape.forEach((point, index) => {
                const dist = distanceSquared(point.latitude, point.longitude, latitude, longitude);
                if (dist < bestDistance) {
                    bestDistance = dist;
                    bestIndex = index;
                }
            });

            return bestIndex;
        }

        function routeDistanceBetween(routeId, startIndex, endIndex) {
            const shape = routeData[routeId]?.shape || [];
            if (!shape.length || startIndex < 0 || endIndex < 0 || endIndex < startIndex) return 0;
            const start = shape[Math.min(startIndex, shape.length - 1)]?.distanceMeters || 0;
            const end = shape[Math.min(endIndex, shape.length - 1)]?.distanceMeters || 0;
            return Math.max(0, end - start);
        }

        function routeAverageSpeed(routeId) {
            const buses = latestBuses.filter(bus => normalizeRouteId(bus.routeId) === routeId && num(bus.speed) > 1);
            if (buses.length) {
                return Math.max(4, buses.reduce((sum, bus) => sum + num(bus.speed), 0) / buses.length);
            }
            return 7.5;
        }

        function stopDwellSeconds(stop) {
            const demand = String(stop?.demandLevel || "MEDIUM").toUpperCase();
            if (demand === "HIGH") return 42;
            if (demand === "LOW") return 12;
            return 24;
        }

        function trafficMultiplier(level) {
            const normalized = String(level || "LOW").toUpperCase();
            if (normalized === "HIGH") return 1.6;
            if (normalized === "MEDIUM") return 1.25;
            return 1;
        }

        function stopCluster(clickedStop, clickedRouteId) {
            const nameKey = normalizeStopName(clickedStop.name);
            const cluster = [];

            Object.values(ROUTES).forEach(route => {
                const stops = routeData[route.id]?.stops || [];
                stops.forEach(stop => {
                    const sameName = stop.normalizedName && stop.normalizedName === nameKey;
                    const distance = distanceMeters(clickedStop.latitude, clickedStop.longitude, stop.latitude, stop.longitude);
                    const nearby = distance <= 140;
                    if (nearby || (sameName && distance <= 180) || (route.id === clickedRouteId && Number(stop.sequence) === Number(clickedStop.sequence))) {
                        cluster.push({ routeId: route.id, stop });
                    }
                });
            });

            return cluster;
        }

        function route57AffectedBounds() {
            const scenario = SCENARIOS[selectedScenarioId];
            const stops = routeData.Route_57?.stops || [];
            const affectedSequences = scenario?.affectedSequences || [9, 10, 11];
            const affected = stops.filter(stop => affectedSequences.includes(Number(stop.sequence)));
            if (!affected.length) return null;
            return {
                start: Math.min(...affected.map(stop => stop.routeIndex)),
                end: Math.max(...affected.map(stop => stop.routeIndex)),
                stops: affected
            };
        }

        function route57ScenarioActive() {
            return selectedScenarioId !== "NONE" && Boolean(SCENARIOS[selectedScenarioId]);
        }

        function scenarioVisual(type) {
            const normalized = String(type || "ROADWORKS").toUpperCase();
            if (normalized === "TRAFFIC_JAM") {
                return { color: "#d94141", altColor: "#0f9faf", dash: "8 9", label: "Severe congestion" };
            }
            if (normalized === "SECURITY_CLOSURE") {
                return { color: "#b4232d", altColor: "#2367e8", dash: "2 8", label: "Restricted road" };
            }
            return { color: "#e15a24", altColor: "#009f88", dash: "10 8", label: "Roadworks" };
        }

        function nearestAlternativeDistanceForStop(stop) {
            const data = routeData.Route_57 || {};
            const candidates = [...(data.altStops || []), ...(data.altShape || [])];
            if (!candidates.length) return null;
            return Math.round(Math.min(...candidates.map(point =>
                distanceMeters(stop.latitude, stop.longitude, point.latitude, point.longitude)
            )));
        }

        function route57StopAffectedByScenario(routeId, stop) {
            if (routeId !== "Route_57" || !route57ScenarioActive()) return false;
            const bounds = route57AffectedBounds();
            return Boolean(bounds && stop.routeIndex >= bounds.start && stop.routeIndex <= bounds.end);
        }

        function estimateArrival(bus, routeId, stop) {
            const role = isSupportBus(bus) ? "SUPPORT" : "MAIN";
            const shape = routeData[routeId]?.shape || [];
            if (shape.length < 2) return null;

            if (role === "SUPPORT" && normalizeRouteId(bus.routeId) !== routeId) return null;
            if (role === "SUPPORT" && bus.supportTargetStopName && normalizeStopName(bus.supportTargetStopName) !== normalizeStopName(stop.name)) {
                const currentIndexForSupport = nearestShapeIndex(routeId, num(bus.latitude), num(bus.longitude));
                if (currentIndexForSupport > stop.routeIndex) return null;
            }

            const currentIndex = Number.isFinite(num(bus.currentRouteIndex, NaN))
                ? Math.floor(num(bus.currentRouteIndex))
                : nearestShapeIndex(routeId, num(bus.latitude), num(bus.longitude));

            if (currentIndex < 0 || currentIndex > stop.routeIndex) return null;

            const distanceToStop = distanceMeters(num(bus.latitude), num(bus.longitude), stop.latitude, stop.longitude);
            const atStop = distanceToStop <= 80 || (
                bus.eventType === "STOP"
                && normalizeStopName(bus.currentStopName) === normalizeStopName(stop.name)
            );

            if (atStop) {
                return {
                    routeId,
                    busId: bus.busId,
                    etaMinutes: 0,
                    etaLabel: bus.doorStatus === "OPEN" ? "at stop" : "arriving",
                    delayMinutes: 0,
                    status: role === "SUPPORT" ? "SUPPORT" : "ARRIVING",
                    role,
                    passengers: num(bus.passengerCount),
                    trafficLevel: bus.trafficLevel || "LOW",
                    note: role === "SUPPORT" ? "support bus" : ""
                };
            }

            const distanceAlongRoute = routeDistanceBetween(routeId, currentIndex, stop.routeIndex);
            const currentSpeed = num(bus.speed);
            const baseSpeed = currentSpeed > 1 ? currentSpeed : routeAverageSpeed(routeId);
            const multiplier = trafficMultiplier(bus.trafficLevel);
            const intermediateStops = (routeData[routeId]?.stops || []).filter(item =>
                item.routeIndex > currentIndex && item.routeIndex < stop.routeIndex
            );
            const dwellSeconds = intermediateStops.reduce((sum, item) => sum + stopDwellSeconds(item), 0) + num(bus.dwellRemaining);
            const baseTravelSeconds = distanceAlongRoute / Math.max(2.5, baseSpeed);
            const trafficTravelSeconds = baseTravelSeconds * multiplier;
            const etaSeconds = trafficTravelSeconds + dwellSeconds;
            const delayMinutes = Math.max(0, Math.round((trafficTravelSeconds - baseTravelSeconds) / 60));
            const etaMinutes = Math.max(1, Math.round(etaSeconds / 60));

            return {
                routeId,
                busId: bus.busId,
                etaMinutes,
                etaLabel: `${etaMinutes} min`,
                delayMinutes,
                status: role === "SUPPORT" ? "SUPPORT" : delayMinutes > 0 ? "DELAYED" : "ON TIME",
                role,
                passengers: num(bus.passengerCount),
                trafficLevel: bus.trafficLevel || "LOW",
                note: currentSpeed <= 1 ? "estimated" : ""
            };
        }

        function arrivalsForStop(clickedStop, clickedRouteId) {
            const cluster = stopCluster(clickedStop, clickedRouteId);
            const byRoute = {};

            cluster.forEach(({ routeId, stop }) => {
                if (!byRoute[routeId]) byRoute[routeId] = { stop, arrivals: [], affected: null };

                if (route57StopAffectedByScenario(routeId, stop)) {
                    byRoute[routeId].affected = {
                        reason: SCENARIOS[selectedScenarioId]?.title || "Route_57 scenario active",
                        replacementDistance: nearestAlternativeDistanceForStop(stop)
                    };
                    return;
                }

                latestBuses
                    .filter(bus => normalizeRouteId(bus.routeId) === routeId)
                    .forEach(bus => {
                        const arrival = estimateArrival(bus, routeId, stop);
                        if (arrival) byRoute[routeId].arrivals.push(arrival);
                    });

                byRoute[routeId].arrivals.sort((a, b) => a.etaMinutes - b.etaMinutes);
                byRoute[routeId].arrivals = byRoute[routeId].arrivals.slice(0, 4);
            });

            return byRoute;
        }

        function etaBadgeClass(status) {
            const normalized = String(status || "").toUpperCase();
            if (normalized === "SUPPORT") return "support";
            if (normalized === "DELAYED") return "delayed";
            if (normalized === "REROUTED") return "rerouted";
            if (normalized === "ARRIVING") return "arriving";
            return "";
        }

        function buildStopEtaPopup(stop, routeId) {
            const groups = arrivalsForStop(stop, routeId);
            const servedRoutes = Object.keys(groups);
            const rows = servedRoutes.map(currentRouteId => {
                const group = groups[currentRouteId];
                const routeColor = getRouteColor(currentRouteId);

                if (group.affected) {
                    const distance = group.affected.replacementDistance;
                    return `
                        <div class="eta-route-group">
                            <div class="eta-route-title"><span style="color:${routeColor}">${escapeHtml(currentRouteId)}</span><span class="eta-badge rerouted">REROUTED</span></div>
                            <div class="eta-row">
                                <div>
                                    <b>Service affected</b>
                                    <div class="eta-meta">${escapeHtml(group.affected.reason)}</div>
                                    <div class="eta-meta">Replacement stop: ${distance == null ? "ETA unavailable" : `${distance} m`}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (!group.arrivals.length) {
                    return `
                        <div class="eta-route-group">
                            <div class="eta-route-title"><span style="color:${routeColor}">${escapeHtml(currentRouteId)}</span><span class="eta-badge delayed">EST.</span></div>
                            <div class="eta-meta">No active bus approaching.</div>
                        </div>
                    `;
                }

                return `
                    <div class="eta-route-group">
                        <div class="eta-route-title"><span style="color:${routeColor}">${escapeHtml(currentRouteId)}</span></div>
                        ${group.arrivals.map(arrival => `
                            <div class="eta-row">
                                <div>
                                    <b>${escapeHtml(arrival.busId)}</b>
                                    <div class="eta-meta">${arrival.role === "SUPPORT" ? "support bus · " : ""}${escapeHtml(arrival.trafficLevel)} traffic${arrival.delayMinutes ? ` · +${arrival.delayMinutes} min delay` : ""}${arrival.note ? ` · ${escapeHtml(arrival.note)}` : ""}</div>
                                </div>
                                <span class="eta-badge ${etaBadgeClass(arrival.status)}">${escapeHtml(arrival.etaLabel)}</span>
                            </div>
                        `).join("")}
                    </div>
                `;
            }).join("");

            return `
                <div class="eta-popup">
                    <div class="eta-stop-title">${escapeHtml(stop.name)}</div>
                    <div class="eta-routes">Served routes: ${servedRoutes.length ? servedRoutes.map(escapeHtml).join(", ") : escapeHtml(routeId)}</div>
                    ${rows || `<div class="eta-meta">No active bus approaching.</div>`}
                </div>
            `;
        }

        function clearTrafficSections() {
            Object.values(trafficSectionLayers).forEach(layer => {
                layer.clearLayers();
                map.removeLayer(layer);
            });
        }

        function renderTrafficSections() {
            clearTrafficSections();
            const mapMode = document.getElementById("map-mode");

            if (!trafficLayerEnabled) {
                mapMode.textContent = "Bus markers and stops visible";
                return;
            }

            latestBuses.forEach(bus => {
                const routeId = normalizeRouteId(bus.routeId);
                if (bus.reroutingActive && routeId === "Route_57") return;
                const shape = routeData[routeId]?.shape || [];
                if (shape.length < 2) return;

                const layerKey = bus.busId;
                const layer = L.layerGroup();
                const index = nearestShapeIndex(routeId, num(bus.latitude), num(bus.longitude));
                if (index < 0) return;

                const start = Math.max(0, index - 4);
                const end = Math.min(shape.length - 1, index + 8);
                const bounds = routeId === "Route_57" && route57ScenarioActive() ? route57AffectedBounds() : null;
                if (bounds) {
                    const blockedStart = Math.floor(num(bounds.start, -1));
                    const blockedEnd = Math.floor(num(bounds.end, -1));
                    const overlapsBlocked = blockedStart >= 0 && blockedEnd >= blockedStart && start <= blockedEnd && end >= blockedStart;
                    if (overlapsBlocked) return;
                }

                const color = isSupportBus(bus) ? "#1a9c62" : getTrafficColor(bus.trafficLevel);
                const section = shape.slice(start, end + 1).map(point => [point.latitude, point.longitude]);

                if (section.length > 1) {
                    L.polyline(section, {
                        color,
                        weight: bus.busId === selectedBusId ? 7 : 5,
                        opacity: bus.busId === selectedBusId ? 0.88 : 0.68,
                        lineCap: "round",
                        lineJoin: "round"
                    }).addTo(layer);
                }

                const previous = lastBusPoints[bus.busId];
                if (previous && normalizeRouteId(previous.routeId) === routeId) {
                    L.polyline([[previous.latitude, previous.longitude], [num(bus.latitude), num(bus.longitude)]], {
                        color,
                        weight: 3,
                        opacity: 0.75,
                        dashArray: "6 7"
                    }).addTo(layer);
                }

                trafficSectionLayers[layerKey] = layer;
                layer.addTo(map);
            });

            mapMode.textContent = trafficLayerEnabled
                ? "Local traffic sections around active buses"
                : "Bus markers and stops visible";
        }

        function incidentIcon(type) {
            const icons = {
                ROADWORKS: "\uD83D\uDEA7",
                TRAFFIC_JAM: "\uD83D\uDEA6",
                SECURITY_CLOSURE: "\u26D4",
                ACCIDENT: "\u26A0\uFE0F",
                BLOCKAGE: "\u26D4"
            };
            return icons[String(type || "").toUpperCase()] || "\u26A0\uFE0F";
        }

        function isScenarioVisible(bus) {
            const decision = String(bus?.reroutingDecision || bus?.reroutingRecommendation?.decisionType || "NORMAL");
            return route57ScenarioActive() || (Boolean(bus?.scenarioId) && !["NORMAL", "MONITOR"].includes(decision));
        }

        function activeScenarioBus() {
            if (!route57ScenarioActive()) return null;
            return latestBuses.find(item =>
                normalizeRouteId(item.routeId) === "Route_57" && !isSupportBus(item)
            ) || latestBuses.find(item => normalizeRouteId(item.routeId) === "Route_57") || null;
        }

        function displayScenarioForBus(bus) {
            const selected = SCENARIOS[selectedScenarioId];
            if (selected) return selected;
            if (!bus?.scenarioId) return null;
            return {
                scenarioId: bus.scenarioId,
                routeId: normalizeRouteId(bus.routeId),
                incidentType: bus.incidentType,
                title: bus.incidentTitle,
                description: bus.incidentDescription,
                severity: "HIGH",
                expectedDelayMinutes: num(bus.expectedDelayMinutes)
            };
        }

        function renderScenarioLayers() {
            scenarioLayer.clearLayers();

            if (!route57ScenarioActive()) return;

            const bus = activeScenarioBus();
            const scenario = displayScenarioForBus(bus) || SCENARIOS[selectedScenarioId];
            const visual = scenarioVisual(scenario?.incidentType);
            const data = routeData.Route_57 || {};
            const shape = data.shape || [];
            const bounds = route57AffectedBounds();
            const start = Math.max(0, Math.floor(num(bus?.affectedSegmentStartIndex, bounds?.start ?? -1)));
            const end = Math.min(shape.length - 1, Math.floor(num(bus?.affectedSegmentEndIndex, bounds?.end ?? -1)));

            if (shape.length > 1 && start >= 0 && end > start) {
                const section = shape.slice(start, end + 1).map(point => [point.latitude, point.longitude]);
                L.polyline(section, {
                    color: visual.color,
                    weight: 9,
                    opacity: 0.88,
                    dashArray: visual.dash,
                    className: "roadworks-line",
                    lineCap: "round",
                    lineJoin: "round"
                }).addTo(scenarioLayer);

                const midPoint = shape[Math.floor((start + end) / 2)];
                [start, Math.floor((start + end) / 2), end].forEach(index => {
                    const point = shape[index];
                    if (!point) return;
                    L.marker([point.latitude, point.longitude], {
                        icon: L.divIcon({
                            className: "",
                            html: `<div class="incident-marker">${incidentIcon(scenario?.incidentType || bus?.incidentType)}</div>`,
                            iconSize: [28, 28],
                            iconAnchor: [14, 14]
                        })
                    }).bindPopup(`
                        <div>
                            <div class="popup-title">${escapeHtml(scenario?.title || bus?.incidentTitle || "Route incident")}</div>
                            <div class="popup-row"><span>Route</span><b>Route_57</b></div>
                            <div class="popup-row"><span>Severity</span><b>${escapeHtml(scenario?.severity || "HIGH")}</b></div>
                        </div>
                    `).addTo(scenarioLayer);
                });

                L.marker([midPoint.latitude, midPoint.longitude], {
                    icon: L.divIcon({
                        className: "",
                        html: `<div class="incident-label">${escapeHtml(visual.label)}</div>`,
                        iconSize: [116, 26],
                        iconAnchor: [58, -10]
                    })
                }).addTo(scenarioLayer);
            }

            if (data.altShape?.length > 1) {
                L.polyline(data.altShape.map(point => [point.latitude, point.longitude]), {
                    color: visual.altColor,
                    weight: 6,
                    opacity: 0.86,
                    lineCap: "round",
                    lineJoin: "round"
                }).addTo(scenarioLayer);
            }
        }

        function renderRouteControls() {
            const container = document.getElementById("route-status-list");
            const byRoute = aggregateRoutes();

            container.innerHTML = Object.values(ROUTES).map(route => {
                const stats = byRoute[route.id] || { buses: [], ordinaryCount: 0, supportCount: 0, avgLoad: 0, status: "MONITOR", statusClass: "", interval: `${Math.round((route.headwaySeconds || 420) / 60)} min est.` };
                const data = routeData[route.id] || {};
                const traffic = stats.status;
                return `
                    <div class="route-card">
                        <div class="route-head">
                            <div class="route-name">
                                <span class="route-color" style="background:${route.color}"></span>
                                <span>${escapeHtml(route.id)}</span>
                            </div>
                            <span class="route-status ${stats.statusClass}">${escapeHtml(traffic)}</span>
                        </div>
                        <div class="route-stats">
                            <div class="mini-stat"><span>Ordinary</span><b>${stats.ordinaryCount}</b></div>
                            <div class="mini-stat"><span>Support</span><b>${stats.supportCount}</b></div>
                            <div class="mini-stat"><span>Avg load</span><b>${stats.avgLoad}%</b></div>
                            <div class="mini-stat"><span>Interval</span><b>${escapeHtml(stats.interval)}</b></div>
                            <div class="mini-stat"><span>Stops</span><b>${data.stops?.length || 0}</b></div>
                        </div>
                        <div class="route-actions">
                            <button class="small-btn ${route.showFullRoute ? "active" : ""}" data-action="route" data-route="${route.id}">
                                ${route.showFullRoute ? "Hide full route" : "Show full route"}
                            </button>
                            <button class="small-btn ${route.showStops ? "active" : ""}" data-action="stops" data-route="${route.id}">
                                ${route.showStops ? "Hide stops" : "Show stops"}
                            </button>
                        </div>
                    </div>
                `;
            }).join("");

            container.querySelectorAll("button[data-route]").forEach(button => {
                button.addEventListener("click", () => {
                    const route = ROUTES[button.dataset.route];
                    if (!route) return;
                    if (button.dataset.action === "route") route.showFullRoute = !route.showFullRoute;
                    if (button.dataset.action === "stops") route.showStops = !route.showStops;
                    renderRouteControls();
                    renderStaticRouteLayers();
                    renderTrafficSections();
                });
